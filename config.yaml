#config.yaml

simulation:
  h: 0.05               # Sampling time [s]
  T_final: 500         # Final simulation time [s]

load_condition:
  mp: 0.0               # Payload mass (front cabin) [kg]

ocean_current:
  V_c: 0.0              # Ocean current speed [m/s]
  beta_c: 30.0          # Ocean current heading [rad]


waypoints: 
# Each column are a waypoint (x, y)
# The first waypoint are only used to find the initial heading
# The next waypoints, except the 2 last ones, are used for path following
# The last 2 waypoints are used with DP for berthing. 
  x: [0, 0, 10]
  y: [0,20, 30]

  #x: [0, 0, 15, 20]
  #y: [0,15, 15, 20]

  #x: [0,  0, 40, 40] 
  #y: [0, 40, 40, 80] 

  #x: [0,  -5, 5, 40] 
  #y: [0, 10, 20, 80] 

  #x: [0,  0, 40, 40, 70, 70] 
  #y: [0, 40, 40, 10, 30, 50] 

  #x: [0,  0, -20, -20, -34, -20, -50]
  #y: [0, 20,  20,  40,  54,  68, 50]


path_following:
  #Additional parameter for straight-line path following
  R_switch: 3  # Radius for mode switch on last waypoint [m]
  K_f: 0.3     # LOS observer gain

  #LOS, ALOS and ILOS parameters
  Delta_h: 15    # Look-ahead distance
  gamma_h: 0.001 # ALOS adaptive gain
  kappa:   0.001 # ILOS integral gain

