#config.yaml

simulation:
  h: 0.05        # Sampling time [s]
  T_final: 1200  # Final simulation time [s]

load_condition:
  mp: 0.0              # Payload mass [kg]
  rp: [1.0, 0.0, 0.0]  # Payload location [m]

ocean_current:
  V_c: 0.0      #Ocean current speed [m/s]
  beta_c: 30.0  #Ocean current heading [rad]

path_following:
  R_switch: 0.5  # How close x, y error must be before WP is reached

azimuth_pods:
  T_n: 0.5  # Propeller time constant [s]
  T_alpha: 1 # Azimuth angle time constant [s]



